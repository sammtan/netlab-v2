# NetLab Development Environment
# Docker Compose configuration for isolated development and runtime environments

version: '3.8'

services:
  # =============================================================================
  # ISOLATED DEVELOPMENT ENVIRONMENT (IDEV)
  # =============================================================================
  
  netlab-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: netlab-development
    hostname: netlab-dev
    
    # Volume mappings for development
    volumes:
      # Mount source code for live development
      - .:/workspace:rw
      
      # Mount host's Docker socket for Docker-in-Docker
      - /var/run/docker.sock:/var/run/docker.sock
      
      # Mount host VirtualBox for VM integration (Linux)
      - /usr/bin/VBoxManage:/usr/bin/VBoxManage:ro
      
      # Persistent volumes for development data
      - netlab_dev_home:/home/netlab
      - netlab_dev_go:/go
      - netlab_dev_cache:/home/netlab/.cache
      
    # Environment variables
    environment:
      # Development flags
      - NETLAB_DEV=true
      - NETLAB_WORKSPACE=/workspace
      - PYTHONPATH=/workspace
      
      # Docker integration
      - DOCKER_HOST=unix:///var/run/docker.sock
      
      # Git configuration
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-NetLab Developer}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-dev@netlab.dev}
      - GIT_COMMITTER_NAME=${GIT_AUTHOR_NAME:-NetLab Developer}
      - GIT_COMMITTER_EMAIL=${GIT_AUTHOR_EMAIL:-dev@netlab.dev}
    
    # Network configuration
    networks:
      - netlab-dev-net
    
    # Keep container running for interactive development
    stdin_open: true
    tty: true
    
    # Resource limits for development container
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
  
  # =============================================================================
  # DEVELOPMENT SERVICES
  # =============================================================================
  
  # Documentation server
  docs:
    image: python:3.11-alpine
    container_name: netlab-docs
    working_dir: /docs
    volumes:
      - ./docs:/docs:ro
    command: >
      sh -c "pip install sphinx sphinx-rtd-theme &&
             sphinx-build -b html . _build/html &&
             cd _build/html &&
             python -m http.server 8000 --bind 0.0.0.0"
    ports:
      - "8000:8000"
    networks:
      - netlab-dev-net
    profiles:
      - docs

  # Code quality and testing service
  quality:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: netlab-quality
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command: >
      sh -c "
        echo 'Running code quality checks...' &&
        python -m black --check . &&
        python -m flake8 . &&
        python -m mypy cli/ core/ scripts/ &&
        python -m pytest tests/ --cov=cli --cov=core --cov-report=html
      "
    networks:
      - netlab-dev-net
    profiles:
      - test

  # =============================================================================
  # MOCK SERVICES FOR TESTING
  # =============================================================================
  
  # Mock VM backend for testing
  mock-libvirt:
    image: alpine:latest
    container_name: netlab-mock-libvirt
    command: >
      sh -c "
        apk add --no-cache socat &&
        echo 'Mock libvirt service for testing' &&
        socat TCP-LISTEN:16509,fork,reuseaddr EXEC:'echo Mock libvirt'
      "
    ports:
      - "16509:16509"
    networks:
      - netlab-dev-net
    profiles:
      - test

  # Mock container registry for testing
  mock-registry:
    image: registry:2
    container_name: netlab-mock-registry
    ports:
      - "5000:5000"
    networks:
      - netlab-dev-net
    profiles:
      - test

# =============================================================================
# NETWORKS
# =============================================================================

networks:
  netlab-dev-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
          gateway: 172.20.0.1
    driver_opts:
      com.docker.network.bridge.name: netlab-dev

# =============================================================================
# VOLUMES
# =============================================================================

volumes:
  netlab_dev_home:
    name: netlab_dev_home
    driver: local
  
  netlab_dev_go:
    name: netlab_dev_go
    driver: local
  
  netlab_dev_cache:
    name: netlab_dev_cache
    driver: local